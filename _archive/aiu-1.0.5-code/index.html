<body>
<script>
/* Start-up safety net: there is no loading screen. If Aiu can't start, a small bar at the top says why, with a Reload button. */
(function () {
  function bar(text) {
    var b = document.getElementById('aiubar');
    if (!b) { b = document.createElement('div'); b.id = 'aiubar'; b.className = 'aiubar'; b.setAttribute('role', 'alert'); document.body.appendChild(b); }
    b.innerHTML = ''; var s = document.createElement('span'); s.textContent = text; b.appendChild(s);
    var r = document.createElement('button'); r.type = 'button'; r.textContent = 'Reload'; r.onclick = function () { location.reload(); }; b.appendChild(r);
  }
  window.AIU_BAR = bar;
  window.addEventListener('error', function (e) {
    if (window.AIU_STARTED) return;
    var t = e && e.target && e.target.src ? 'a file did not load (' + String(e.target.src).split('/').pop().split('?')[0] + ')' : (e && e.message) || 'unknown error';
    bar('Aiu could not start: ' + t + '. Check your connection and reload.');
    document.getElementById('aiubar').setAttribute('data-keep', '1'); // stays until you reload
  }, true);
  setTimeout(function () { if (!window.AIU_STARTED) bar('Aiu is taking a while to start. Check your connection, or reload.'); }, 8000);
})();
</script>
<div id="app"></div>
<noscript><p style="padding:16px">Aiu Totem needs JavaScript turned on.</p></noscript>
